<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SL Resa</title>
<meta name="theme-color" content="#0b5fa5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SL Resa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #15191e;
    --muted: #66707c;
    --line: #dde2e8;
    --accent: #0b5fa5;
    --accent-text: #ffffff;
    --good: #12805c;
    --late: #c4320a;
    --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --card: #181c23;
      --text: #e8ebef;
      --muted: #9aa4b0;
      --line: #2a303a;
      --accent: #4a9be0;
      --accent-text: #0e1116;
      --good: #3fc08e;
      --late: #ff7a52;
      --chip: #222833;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 16px 0 12px; }
  button, input { font: inherit; color: inherit; }

  .card { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .places { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .fields { display: grid; gap: 8px; }
  .field { position: relative; }
  .field label { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; width: 40px; }
  .field input {
    width: 100%; padding: 12px 40px 12px 52px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); font-size: 17px; /* >=16px stops iOS zooming on focus */
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field .icon-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
  .icon-btn { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 8px; color: var(--muted); font-size: 18px; cursor: pointer; }
  .icon-btn:active { background: var(--chip); }
  .swap { font-size: 22px; }

  .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0; padding: 4px 0; list-style: none; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 320px; overflow-y: auto; }
  .suggest li { padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .suggest li:active, .suggest li.hi { background: var(--chip); }
  .suggest .kind { font-size: 12px; color: var(--muted); flex: none; width: 48px; }
  .suggest .sub { color: var(--muted); font-size: 13px; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 10px; padding: 3px; margin-top: 12px; }
  .seg button { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-size: 15px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .when { margin-top: 8px; }
  .when input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 17px; min-height: 44px; }
  .search { width: 100%; margin-top: 12px; padding: 13px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 17px; cursor: pointer; }
  .search:disabled { opacity: .6; }

  .recent { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .recent button { border: 0; background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }

  .status { color: var(--muted); text-align: center; padding: 20px 8px; }
  .error { color: var(--late); }
  .summary { color: var(--muted); font-size: 13px; margin: 16px 4px 8px; }

  .trips { display: grid; gap: 8px; }
  .trip { background: var(--card); border-radius: 14px; padding: 12px; cursor: pointer; }
  .trip .top { display: flex; align-items: baseline; gap: 8px; }
  .trip .times { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .trip .dur { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  .trip .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .legs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 8px; }
  .line { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 6px; color: #fff; font-size: 13px; font-weight: 700; }
  .walk { color: var(--muted); font-size: 13px; }
  .arrow { color: var(--muted); font-size: 12px; }
  .rt-late { color: var(--late); }
  .old { text-decoration: line-through; color: var(--muted); font-weight: 400; font-size: .8em; }

  .opts { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 6px; }
  .opts-head { color: var(--muted); font-size: 13px; margin: 2px 0 4px; }
  .opt { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; align-items: center; width: 100%; border: 0; background: transparent; text-align: left; padding: 7px 4px; border-radius: 8px; cursor: pointer; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt[aria-expanded="true"] { background: var(--chip); }
  .opt .wait { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  .opt .wait.tight { color: var(--late); }
  .opt .arr { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .opt .arr small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .opt .legs { margin-top: 0; }
  .too-late { color: var(--late); font-size: 12px; font-weight: 400; }
  .detail { margin-top: 6px; padding: 4px 4px 8px; display: none; }
  .detail.open { display: block; }
  .step { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 0; font-size: 14px; }
  .step .t { font-variant-numeric: tabular-nums; font-weight: 600; }
  .step .what { color: var(--muted); }
  .step .info { color: var(--late); font-size: 13px; margin-top: 2px; }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <h1>SL Resa</h1>

  <form class="card" id="form" autocomplete="off">
    <div class="places">
      <div class="fields">
        <div class="field">
          <label for="from">Från</label>
          <input id="from" type="search" placeholder="Hållplats eller adress" enterkeyhint="next">
          <button type="button" class="icon-btn" id="locate" title="Min position" aria-label="Använd min position">◎</button>
        </div>
        <div class="field">
          <label for="to">Till</label>
          <input id="to" type="search" placeholder="Hållplats eller adress" enterkeyhint="search">
        </div>
      </div>
      <button type="button" class="icon-btn swap" id="swap" title="Byt riktning" aria-label="Byt riktning">⇅</button>
    </div>

    <div class="seg" role="group" aria-label="Tid">
      <button type="button" data-mode="now" aria-pressed="true">Nu</button>
      <button type="button" data-mode="dep" aria-pressed="false">Avgå</button>
      <button type="button" data-mode="arr" aria-pressed="false">Framme</button>
    </div>
    <div class="when" id="when" hidden>
      <input id="datetime" type="datetime-local" aria-label="Datum och tid">
    </div>

    <button class="search" id="go" type="submit">Sök resa</button>
  </form>

  <div class="recent" id="recent"></div>
  <div id="out"></div>
  <p class="foot">Egen reseplanerare på SL:s tidtabell (GTFS Regional, Trafiklab) med realtid.<br>Byten mellan hållplatser inom 300 m räknas som 0 min. Gång till/från hållplats: 5 km/h, max 1 km.<br><span id="feed"></span></p>
</main>

<script type="module">
import { parseDay, planner, applyRealtime } from './router.js';
import { fetchTripUpdates } from './realtime.js';

// Place search still uses SL's open stop-finder (no key needed).
const API = 'https://journeyplanner.integration.sl.se/v2';
const TZ = 'Europe/Stockholm';
const MIN = 60 * 1000;
// stops + streets + addresses + POIs (bitmask for any_obj_filter_sf)
const PLACE_FILTER = 2 | 4 | 8 | 32;
const GROUPS_PER_PAGE = 6;
// Realtime only matters for trips in the near future.
const REALTIME_WINDOW = 3 * 3600 * 1000;

const $ = (id) => document.getElementById(id);
const state = { mode: 'now', from: null, to: null };

// ---------- time helpers (timetable times are Stockholm local) ----------

const partsFmt = new Intl.DateTimeFormat('sv-SE', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
});
function stockholmParts(epoch) {
  const p = Object.fromEntries(partsFmt.formatToParts(new Date(epoch)).map((x) => [x.type, x.value]));
  return { y: p.year, mo: p.month, d: p.day, h: p.hour, mi: p.minute };
}
function inputValue(epoch) {
  const p = stockholmParts(epoch);
  return `${p.y}-${p.mo}-${p.d}T${p.h}:${p.mi}`;
}
// "YYYY-MM-DDTHH:MM" in Stockholm time -> epoch ms
function fromInputValue(v) {
  const [date, time] = v.split('T');
  const [y, mo, d] = date.split('-').map(Number);
  const [h, mi] = time.split(':').map(Number);
  const naive = Date.UTC(y, mo - 1, d, h, mi);
  const p = stockholmParts(naive);
  const offset = Date.UTC(+p.y, +p.mo - 1, +p.d, +p.h, +p.mi) - naive;
  return naive - offset;
}
const hm = (epoch) => { const p = stockholmParts(epoch); return `${p.h}:${p.mi}`; };
function fmtDur(ms) {
  const m = Math.round(ms / MIN);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`;
}
// Weekday + date prefix, omitted when epoch falls on the same day as `ref`.
function dayLabel(epoch, ref = Date.now()) {
  const today = stockholmParts(ref);
  const p = stockholmParts(epoch);
  if (p.y === today.y && p.mo === today.mo && p.d === today.d) return '';
  return new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' }).format(epoch) + ' ';
}

// ---------- places ----------

async function getJSON(path, params) {
  const url = `${API}/${path}?${new URLSearchParams(params)}`;
  const res = await fetch(url);
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error(body?.error_message || `HTTP ${res.status}`);
  return body;
}

async function findPlaces(text) {
  const data = await getJSON('stop-finder', { name_sf: text, any_obj_filter_sf: PLACE_FILTER, type_sf: 'any' });
  return (data.locations || [])
    .filter((l) => Array.isArray(l.coord))
    .sort((a, b) => (b.matchQuality || 0) - (a.matchQuality || 0))
    .map((l) => ({ id: l.id, name: l.disassembledName && l.type === 'stop' ? l.disassembledName : l.name, full: l.name, type: l.type, coord: l.coord }));
}

async function resolvePlace(input, current) {
  const text = input.value.trim();
  if (current && current.label === text && current.coord) return current;
  if (!text) return null;
  const [best] = await findPlaces(text);
  if (!best) throw new Error(`Hittade ingen plats för "${text}"`);
  input.value = best.name;
  return { ...best, label: best.name };
}

// ---------- timetable ----------

// One file per service day, built nightly from SL's GTFS feed (tools/build-data.mjs).
const days = new Map(); // ymd -> Promise<timetable>
async function loadDay(ymd) {
  if (!days.has(ymd)) {
    const p = (async () => {
      const res = await fetch(`data/${ymd}.bin.gz`);
      if (!res.ok) throw new Error(`Ingen tidtabell för ${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6)}.`);
      let buf = new Uint8Array(await res.arrayBuffer());
      // Servers may already have undone the gzip; check the magic bytes.
      if (buf[0] === 0x1f && buf[1] === 0x8b) {
        buf = new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
      }
      return parseDay(buf.buffer);
    })();
    p.catch(() => days.delete(ymd));
    days.set(ymd, p);
  }
  return days.get(ymd);
}
const ymdOf = (epoch) => { const p = stockholmParts(epoch); return `${p.y}${p.mo}${p.d}`; };
const midnightOf = (ymd) => fromInputValue(`${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6)}T00:00`);

// ---------- search ----------

// The current result list; scrolling to its end loads later departures.
let session = null;

async function search() {
  const out = $('out');
  const go = $('go');
  go.disabled = true;
  session = null;
  out.innerHTML = '<p class="status">Söker…</p>';
  try {
    state.from = await resolvePlace($('from'), state.from);
    state.to = await resolvePlace($('to'), state.to);
    if (!state.from || !state.to) throw new Error('Fyll i både från och till.');

    const mode = state.mode === 'arr' ? 'arr' : 'dep';
    const target = state.mode === 'now' ? Date.now() : fromInputValue($('datetime').value);
    const ymd = ymdOf(target);
    const tt = await loadDay(ymd);
    const midnight = midnightOf(ymd);

    let rtNote = '';
    const nearNow = target > Date.now() - REALTIME_WINDOW && target < Date.now() + REALTIME_WINDOW;
    if (nearNow) {
      try {
        const { updates } = await fetchTripUpdates();
        applyRealtime(tt, updates, midnight / 1000);
      } catch {
        applyRealtime(tt, [], midnight / 1000);
        rtNote = 'Realtid kunde inte hämtas, visar tidtabell.';
      }
    } else applyRealtime(tt, [], midnight / 1000);

    const p = planner(tt, { lat: state.from.coord[0], lon: state.from.coord[1] }, { lat: state.to.coord[0], lon: state.to.coord[1] });
    const toSec = (epoch) => Math.round((epoch - midnight) / 1000);
    const s = { from: state.from, to: state.to, mode, target, midnight, planner: p, groups: [], done: false, loading: false, rtNote };

    if (mode === 'dep') {
      s.groups = p.next(toSec(target), GROUPS_PER_PAGE);
      if (!s.groups.length) s.done = true;
    } else {
      // Arrive by: sweep departures before the deadline, keep the last ones that make it.
      const deadline = toSec(target);
      let groups = [];
      for (const back of [90, 180, 360]) {
        const q = planner(tt, { lat: state.from.coord[0], lon: state.from.coord[1] }, { lat: state.to.coord[0], lon: state.to.coord[1] });
        groups = [];
        for (let i = 0; i < 6; i++) {
          const batch = q.next(deadline - back * 60, 8, back * 60);
          if (!batch.length) break;
          groups.push(...batch);
          if (batch.some((g) => g.main.arrive > deadline)) break;
        }
        groups = groups.filter((g) => g.main.arrive <= deadline);
        groups.sort((a, b) => a.leave - b.leave || a.main.arrive - b.main.arrive);
        if (groups.length) break;
      }
      s.groups = groups.slice(-GROUPS_PER_PAGE);
      s.done = true;
    }
    session = s;
    render(s);
    saveRecent(state.from, state.to);
  } catch (err) {
    console.error(err);
    out.innerHTML = `<p class="status error">${esc(err.message || 'Något gick fel')}</p>`;
  } finally {
    go.disabled = false;
  }
}

function loadMore() {
  const s = session;
  if (!s || s.done || s.loading) return;
  s.loading = true;
  $('sentinel').textContent = 'Hämtar senare avgångar…';
  // Let the message paint before the (synchronous) search runs.
  setTimeout(() => {
    let fresh = [];
    try { fresh = s.planner.next(0, GROUPS_PER_PAGE); } catch { /* fall through */ }
    s.loading = false;
    if (!fresh.length) s.done = true;
    if (session !== s) return;
    s.groups.push(...fresh);
    appendGroups(s, fresh);
  }, 0);
}

// ---------- rendering ----------

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// GTFS route_type -> the product classes the colours below were written for.
const CLS = { 401: 2, 100: 0, 900: 4, 700: 5, 1000: 9 };
const PRODUCT = { 2: 'Tunnelbana', 0: 'Pendeltåg', 4: 'Spårväg', 5: 'Buss', 9: 'Båt' };
const cls = (leg) => CLS[leg.type] ?? 5;
function product(leg) {
  const c = cls(leg);
  if (c === 4 && leg.desc) return leg.desc;
  return PRODUCT[c] || 'Linje';
}

function lineColor(leg) {
  const n = parseInt(leg.line, 10);
  switch (cls(leg)) {
    case 2: // tunnelbana
      if ([10, 11].includes(n)) return '#0089ca';
      if ([13, 14].includes(n)) return '#d71d24';
      return '#179c4b';
    case 0: return '#ec619f'; // pendeltåg
    case 4: // spårväg & lokalbanor
      if ([25, 26].includes(n)) return '#21b6ba';
      if ([27, 28, 29].includes(n)) return '#a86dae';
      if ([30, 31].includes(n)) return '#d77d00';
      if (n === 21) return '#b65f1f';
      return '#778da7';
    case 5: // buss
      return leg.desc === 'blåbuss' ? '#0089ca' : '#d71d24';
    case 9: return '#00a7b5'; // båt
    default: return '#5b6570';
  }
}
const icon = (leg) => ({ 0: '🚆', 2: 'T', 4: '🚊', 5: '🚌', 9: '⛴' }[cls(leg)] || '•');

// Seconds after the service day's midnight -> epoch ms.
const at = (s, secs) => s.midnight + secs * 1000;

function timeHtml(s, secs, sched, rt) {
  const late = Math.round((secs - sched) / 60);
  const live = rt ? ' title="Realtid"' : '';
  if (Math.abs(late) < 1) return `<span${live}>${hm(at(s, secs))}</span>`;
  return `<span class="rt-late"${live}>${hm(at(s, secs))}</span> <span class="old">${hm(at(s, sched))}</span>`;
}
const chip = (leg) => `<span class="line" style="background:${lineColor(leg)}">${icon(leg)} ${esc(leg.line)}</span>`;
const chipsHtml = (legs) => legs.map(chip).join('<span class="arrow">›</span>');
const walkMin = (w) => Math.max(1, Math.round(w.secs / 60));
const changesText = (n) => (n === 0 ? 'Inga byten' : n === 1 ? '1 byte' : `${n} byten`);

function detailHtml(s, j) {
  const steps = [];
  const first = j.legs[0], last = j.legs[j.legs.length - 1];
  if (j.walkIn.m > 0) {
    steps.push(`<div class="step"><div class="t">${hm(at(s, j.leave))}</div><div><b>Gå</b> till ${esc(first.fromName)} <span class="what">· ${walkMin(j.walkIn)} min (${j.walkIn.m} m)</span></div></div>`);
  }
  j.legs.forEach((l, i) => {
    if (i > 0) {
      const prev = j.legs[i - 1];
      const wait = Math.round((l.dep - prev.arr) / 60);
      const where = prev.toName === l.fromName ? esc(l.fromName) : `${esc(prev.toName)} → ${esc(l.fromName)}`;
      steps.push(`<div class="step"><div class="t"></div><div class="what">Byte vid ${where} · väntetid ${wait} min</div></div>`);
    }
    const plat = l.fromPlatform ? ` · läge ${esc(l.fromPlatform)}` : '';
    const mins = Math.max(1, Math.round((l.arr - l.dep) / 60));
    steps.push(`<div class="step"><div class="t">${timeHtml(s, l.dep, l.schedDep, l.depRt)}</div><div>
        <b>${esc(product(l))} ${esc(l.line)}</b> mot ${esc(l.headsign)}
        <div class="what">${esc(l.fromName)}${plat} → ${esc(l.toName)} (${timeHtml(s, l.arr, l.schedArr, l.arrRt)}) · ${mins} min, ${l.stops} hpl</div>
      </div></div>`);
  });
  if (j.walkOut.m > 0) {
    steps.push(`<div class="step"><div class="t">${hm(at(s, last.arr))}</div><div><b>Gå</b> från ${esc(last.toName)} till målet <span class="what">· ${walkMin(j.walkOut)} min (${j.walkOut.m} m)</span></div></div>`);
  }
  steps.push(`<div class="step"><div class="t">${hm(at(s, j.arrive))}</div><div><b>Framme</b></div></div>`);
  return steps.join('');
}

function groupHtml(s, g, gi) {
  const m = g.main, first = m.legs[0];
  const walk = m.walkIn.m > 0 ? `Gå ${walkMin(m.walkIn)} min · ` : '';
  const head = `<div class="top">
      <span class="times">${dayLabel(at(s, g.leave), s.target)}${timeHtml(s, first.dep, first.schedDep, first.depRt)}</span>
      <span class="dur">${chip(first)}</span>
    </div>
    <div class="meta">${walk}${esc(product(first))} ${esc(first.line)} mot ${esc(first.headsign)} från ${esc(first.fromName)}${first.fromPlatform ? ` (läge ${esc(first.fromPlatform)})` : ''}</div>`;

  const deadline = s.mode === 'arr' ? Math.round((s.target - s.midnight) / 1000) : Infinity;
  const late = (o) => (o.arrive > deadline ? ' <span class="too-late">för sent</span>' : '');
  const rows = g.options.map((o, oi) => {
    const rest = o.wait === null ? o.legs : o.legs.slice(1);
    const wait = o.wait === null ? '' : `<span class="wait${o.wait < 120 ? ' tight' : ''}">${Math.round(o.wait / 60)} min</span>`;
    return `<button type="button" class="opt" data-g="${gi}" data-o="${oi}" aria-expanded="false">
        ${o.wait === null ? '<span class="wait">Direkt</span>' : wait}
        <span class="legs">${chipsHtml(rest)}</span>
        <span class="arr">${hm(at(s, o.arrive))}${late(o)}<small>${fmtDur((o.arrive - g.leave) * 1000)} · ${changesText(o.changes)}</small></span>
      </button><div class="detail" id="d-${gi}-${oi}">${detailHtml(s, o)}</div>`;
  }).join('');
  const where = m.legs.length > 1
    ? `<div class="opts-head">Framme vid ${esc(first.toName)} ${timeHtml(s, first.arr, first.schedArr, first.arrRt)} · byte (väntetid):</div>`
    : '';
  return `<article class="trip">${head}<div class="opts">${where}${rows}</div></article>`;
}

function render(s) {
  const out = $('out');
  if (!s.groups.length) {
    out.innerHTML = '<p class="status">Inga resor hittades för den tiden.</p>';
    return;
  }
  const label = s.mode === 'arr' ? `framme senast ${dayLabel(s.target)}${hm(s.target)}` : `avgång från ${dayLabel(s.target)}${hm(s.target)}`;
  const note = s.rtNote ? ` · <span class="error">${esc(s.rtNote)}</span>` : '';
  out.innerHTML = `
    <p class="summary">${esc(s.from.label)} → ${esc(s.to.label)} · ${label}${note}</p>
    <div class="trips" id="trips"></div>
    <p class="status" id="sentinel"></p>`;
  appendGroups(s, s.groups);
}

function appendGroups(s, groups) {
  const list = $('trips');
  const offset = list.children.length;
  list.insertAdjacentHTML('beforeend', groups.map((g, i) => groupHtml(s, g, offset + i)).join(''));
  const sentinel = $('sentinel');
  sentinel.textContent = s.done ? (s.mode === 'dep' ? 'Inga fler avgångar hittades.' : '') : '';
  // Re-observing makes the observer re-check, so a short list keeps filling the screen.
  scrollObserver.unobserve(sentinel);
  if (!s.done) scrollObserver.observe(sentinel);
}

const scrollObserver = new IntersectionObserver((entries) => {
  if (entries.some((e) => e.isIntersecting)) loadMore();
}, { rootMargin: '400px 0px' });

$('out').addEventListener('click', (e) => {
  const opt = e.target.closest('.opt');
  if (!opt) return;
  const open = opt.getAttribute('aria-expanded') !== 'true';
  opt.setAttribute('aria-expanded', String(open));
  $(`d-${opt.dataset.g}-${opt.dataset.o}`).classList.toggle('open', open);
});

// ---------- autocomplete ----------

function setupAutocomplete(input, key) {
  const field = input.parentElement;
  let list = null, timer = null, seq = 0, items = [], hi = -1;

  const close = () => { list?.remove(); list = null; items = []; hi = -1; };
  const pick = (p) => {
    state[key] = { ...p, label: p.name };
    input.value = p.name;
    close();
    if (key === 'from' && !$('to').value) $('to').focus(); else input.blur();
  };
  const show = (places) => {
    close();
    if (!places.length || document.activeElement !== input) return;
    items = places.slice(0, 8);
    list = document.createElement('ul');
    list.className = 'suggest';
    list.innerHTML = items.map((p) => {
      const kind = { stop: 'Hållpl.', poi: 'Plats', singlehouse: 'Adress', street: 'Gata' }[p.type] || '';
      const sub = p.full !== p.name ? `<span class="sub">${esc(p.full.split(',')[0])}</span>` : '';
      return `<li><span class="kind">${kind}</span><span>${esc(p.name)} ${sub}</span></li>`;
    }).join('');
    // pointerdown fires before the input's blur, so the tap isn't lost
    list.querySelectorAll('li').forEach((li, i) => li.addEventListener('pointerdown', (e) => { e.preventDefault(); pick(items[i]); }));
    field.appendChild(list);
  };

  input.addEventListener('input', () => {
    state[key] = null;
    clearTimeout(timer);
    const text = input.value.trim();
    if (text.length < 2) return close();
    timer = setTimeout(async () => {
      const mine = ++seq;
      try {
        const places = await findPlaces(text);
        if (mine === seq) show(places);
      } catch { /* ignore autocomplete errors; search will report */ }
    }, 180);
  });
  input.addEventListener('keydown', (e) => {
    if (!list) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      list.querySelectorAll('li').forEach((li, i) => li.classList.toggle('hi', i === hi));
    } else if (e.key === 'Enter' && hi >= 0) {
      e.preventDefault();
      pick(items[hi]);
    } else if (e.key === 'Escape') close();
  });
  input.addEventListener('blur', () => setTimeout(close, 100));
}

// ---------- recent searches (per-device convenience) ----------

const RECENT_KEY = 'sl-resa-recent';
function loadRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; }
}
function saveRecent(from, to) {
  const strip = ({ id, name, full, type, coord, label }) => ({ id, name, full, type, coord, label });
  const list = loadRecent().filter((r) => !(r.from.label === from.label && r.to.label === to.label));
  list.unshift({ from: strip(from), to: strip(to) });
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 5))); } catch { /* private mode */ }
  renderRecent();
}
function renderRecent() {
  // "Min position" is only valid where it was saved.
  const list = loadRecent().filter((r) => r.from.label !== 'Min position' && r.to.label !== 'Min position');
  const box = $('recent');
  box.innerHTML = list.map((r, i) => `<button type="button" data-i="${i}">${esc(r.from.label)} → ${esc(r.to.label)}</button>`).join('');
  box.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    const r = list[b.dataset.i];
    state.from = r.from; state.to = r.to;
    $('from').value = r.from.label; $('to').value = r.to.label;
    search();
  }));
}

// ---------- wiring ----------

document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  $('when').hidden = state.mode === 'now';
  if (state.mode !== 'now' && !$('datetime').value) $('datetime').value = inputValue(Date.now());
}));

$('swap').addEventListener('click', () => {
  [state.from, state.to] = [state.to, state.from];
  [$('from').value, $('to').value] = [$('to').value, $('from').value];
});

$('locate').addEventListener('click', () => {
  if (!navigator.geolocation) return alert('Platstjänster stöds inte här.');
  $('from').value = 'Hämtar position…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.from = { coord: [pos.coords.latitude, pos.coords.longitude], name: 'Min position', label: 'Min position' };
      $('from').value = 'Min position';
    },
    () => {
      $('from').value = '';
      alert('Kunde inte hämta position. (Kräver https och att Safari får använda platstjänster.)');
    },
    { enableHighAccuracy: true, timeout: 10000 },
  );
});

$('form').addEventListener('submit', (e) => { e.preventDefault(); search(); });
setupAutocomplete($('from'), 'from');
setupAutocomplete($('to'), 'to');
renderRecent();

fetch('data/index.json').then((r) => r.json()).then((ix) => {
  $('feed').textContent = `Tidtabell ${ix.feedVersion || ''}, uppdaterad ${inputValue(Date.parse(ix.built)).replace('T', ' ')}`;
}).catch(() => {});
</script>
